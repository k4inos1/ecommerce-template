name: CI — Backend (Railway)

on:
  push:
    branches: [master, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Start backend
        run: |
          nohup env \
            PORT=4000 \
            MONGODB_URI=mongodb://localhost:27017/test \
            JWT_SECRET=ci-test-secret-key \
            CLIENT_URL=http://localhost:3000 \
            NODE_ENV=test \
            node backend/dist/index.js >/tmp/backend-ci.log 2>&1 &

      - name: Health check
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/backend-ci.log
          exit 1

  notify-deploy:
    name: Notify Deploy Status
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Deploy status
        run: echo "✅ Backend passed CI. Railway will auto-deploy from master."
